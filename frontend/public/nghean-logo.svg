<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nghean.today Logo">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="naBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="48%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Mountain Layers Gradients -->
    <linearGradient id="naMtBack" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="naMtFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Sacred Golden Lotus & Sunrise Gradients -->
    <linearGradient id="naLotus" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Flowing Lam River Gradient -->
    <linearGradient id="naRiver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow Filters -->
    <filter id="naGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Base (App Icon standard) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#naBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Orbital Digital Arc (Symbolizing "Today" / Global connectivity) -->
  <path d="M 10 38 A 22 22 0 0 1 54 18" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.65"/>
  <circle cx="53.5" cy="18.5" r="2.2" fill="#fef08a" filter="url(#naGlow)"/>

  <!-- Majestic Núi Hồng Lĩnh (Back Peak) -->
  <polygon points="12,47 28,21 38,36 31,47" fill="url(#naMtBack)" opacity="0.9"/>

  <!-- Majestic Núi Hồng Lĩnh (Front Peak - Strength & Resilience) -->
  <polygon points="23,47 36,25 50,47" fill="url(#naMtFront)"/>

  <!-- Cánh Sen Vàng Kim Liên (Sacred Lotus Petal of Uncle Ho's Village) -->
  <path d="M 29 45 C 26 36, 29 25, 34 15 C 39 25, 42 36, 39 45 C 36 47, 32 47, 29 45 Z" fill="url(#naLotus)" filter="url(#naGlow)"/>
  <!-- Central Lotus Vein (Ray of Enlightenment) -->
  <line x1="34" y1="17" x2="34" y2="44" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Dòng Sông Lam (Soft, graceful curves of Lam River) -->
  <path d="M 7 48 C 17 41, 26 49, 38 43 C 45 39, 52 45, 57 47 C 51 53, 31 54, 7 48 Z" fill="url(#naRiver)"/>
  <path d="M 11 51 C 21 45, 31 50, 44 45" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>

  <!-- Dawn Star / Tinh tú dẫn lối (North Star of Cultural & Tech Growth) -->
  <circle cx="16" cy="19" r="2" fill="#fef08a" filter="url(#naGlow)"/>
  <line x1="16" y1="15" x2="16" y2="23" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="12" y1="19" x2="20" y2="19" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
</svg>
