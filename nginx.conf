# ─────────────────────────────────────────────────────────────
# Nginx Configuration cho Nghean.today (aaPanel / VPS Reverse Proxy)
# Domain: nghean.today | Port Backend: 3024
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name nghean.today www.nghean.today;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── /api/* → Node.js Express Proxy (Port 3024) ────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3024;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho AI (hỗ trợ streaming và response dài)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded Media / Avatars ───────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3024;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Vite Hashed Assets: Cache dài hạn ──────────────────────
    location /assets/ {
        root    /www/wwwroot/nghean.today/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Media files: Cache 7 ngày ─────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        root    /www/wwwroot/nghean.today/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static files & SPA fallback: CHỐNG DÍNH CACHE index.html ──
    location / {
        root  /www/wwwroot/nghean.today/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
