# ─────────────────────────────────────────────────────────────
# Nginx config cho VTV8.today
# Copy vào: /etc/nginx/sites-available/vtv8-today
# Sau đó: ln -s /etc/nginx/sites-available/vtv8-today /etc/nginx/sites-enabled/
# Rồi: nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name vtv8.today www.vtv8.today;   # ← đổi thành domain của bạn

    # Redirect HTTP → HTTPS (bật sau khi có SSL)
    # return 301 https://$host$request_uri;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── /api/* → Node.js proxy ────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:3013;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho AI (có thể lâu hơn request thường)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Vite Hashed Assets: Cho phép cache dài hạn ───────────
    location /assets/ {
        root    /var/www/vtv8-today/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Media files: Cache 7 ngày ─────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        root    /var/www/vtv8-today/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static files & SPA fallback: TUYỆT ĐỐI KHÔNG CACHE index.html ──
    location / {
        root  /var/www/vtv8-today/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

