<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071728"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Lotus & Wave Arc (Cyan / Blue) -->
  <path d="M 64 16 C 90 16 112 38 112 64 C 112 78 106 90 96 99 C 102 88 104 76 100 64 C 95 48 81 36 64 36 C 54 36 45 40 38 48 C 44 38 53 30 64 26 C 60 20 62 16 64 16 Z" fill="url(#blueGrad)" opacity="0.95"/>
  
  <!-- Red Dynamic Swirl Accent -->
  <path d="M 96 99 C 85 110 68 114 52 108 C 65 106 76 98 82 88 C 88 78 88 66 84 56 C 88 68 94 86 96 99 Z" fill="url(#redGrad)"/>

  <!-- V8 Monogram Typography -->
  <!-- 'V' -->
  <path d="M 32 54 L 46 54 L 54 84 L 62 54 L 74 54 L 59 96 L 47 96 Z" fill="url(#blueGrad)" filter="url(#glow)"/>
  <path d="M 32 54 L 46 54 L 54 84 L 62 54 L 74 54 L 59 96 L 47 96 Z" fill="#ffffff"/>

  <!-- '8' -->
  <path d="M 85 52 C 92 52 97 56 97 62 C 97 67 94 70 89 72 C 95 74 99 78 99 85 C 99 93 92 98 83 98 C 74 98 68 93 68 85 C 68 78 72 74 77 72 C 73 70 70 67 70 62 C 70 56 75 52 83 52 Z M 83 60 C 79 60 76 62 76 65 C 76 68 79 70 83 70 C 87 70 90 68 90 65 C 90 62 87 60 83 60 Z M 83 77 C 78 77 74 80 74 85 C 74 89 78 92 83 92 C 88 92 92 89 92 85 C 92 80 88 77 83 77 Z" fill="url(#blueGrad)" filter="url(#glow)"/>
  <path d="M 85 52 C 92 52 97 56 97 62 C 97 67 94 70 89 72 C 95 74 99 78 99 85 C 99 93 92 98 83 98 C 74 98 68 93 68 85 C 68 78 72 74 77 72 C 73 70 70 67 70 62 C 70 56 75 52 83 52 Z M 83 60 C 79 60 76 62 76 65 C 76 68 79 70 83 70 C 87 70 90 68 90 65 C 90 62 87 60 83 60 Z M 83 77 C 78 77 74 80 74 85 C 74 89 78 92 83 92 C 88 92 92 89 92 85 C 92 80 88 77 83 77 Z" fill="#ffffff"/>
  
  <!-- Red Dot Accent on VTV8 -->
  <circle cx="102" cy="94" r="4.5" fill="#ef4444" filter="url(#glow)"/>
</svg>
